<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Blog App</title>
	<link rel="stylesheet" href="/style.css" />
</head>
<body>
	<header class="header">
		<div class="navbar">
			<div class="brand"><span class="dot"></span> Blog App</div>
			<nav class="nav">
				<a href="/">Home</a>
				<a id="createLink" href="/create.html" style="display:none;">Create</a>
				<a id="loginLink" href="/login.html">Login</a>
				<a id="registerLink" href="/register.html">Register</a>
				<button id="logoutBtn" class="btn secondary" style="display:none;">Logout</button>
			</nav>
		</div>
	</header>
	<div class="container">
		<div class="badge">Latest posts</div>
		<h2 class="section-title">Explore recent blogs</h2>
		<div id="list" class="grid"></div>
	</div>
	<script>
		const token = localStorage.getItem('token');
		const currentUserName = localStorage.getItem('userName');

		function setAuthUI(){
			document.getElementById('loginLink').style.display = token ? 'none' : '';
			document.getElementById('registerLink').style.display = token ? 'none' : '';
			document.getElementById('logoutBtn').style.display = token ? '' : 'none';
			document.getElementById('createLink').style.display = token ? '' : 'none';
		}
		setAuthUI();

		document.getElementById('logoutBtn').addEventListener('click', () => {
			localStorage.removeItem('token');
			localStorage.removeItem('userName');
			location.reload();
		});

		async function fetchBlogs(){
			const res = await fetch('/api/blogs');
			const blogs = await res.json();
			const list = document.getElementById('list');
			list.innerHTML = '';
			for(const b of blogs){
				const canEdit = token && currentUserName && b.author === currentUserName;
				const card = document.createElement('div');
				card.className = 'post-card';
				card.innerHTML = `
					${b.image ? `<div class="post-thumb"><img src="${b.image}" alt="${b.title}" loading="lazy"></div>` : `<div class="post-thumb">No image</div>`}
					<div class="post-body">
						<h3 class="post-title">${b.title}</h3>
						<div class="post-meta">by ${b.author} • ${new Date(b.timestamp).toLocaleString()}</div>
						<div class="post-subtitle">${b.subtitle ? b.subtitle : ''}</div>
						<p class="muted">${b.content.substring(0, 180)}${b.content.length > 180 ? '…' : ''}</p>
						<div class="post-actions">
							${canEdit ? `<button class="btn link" data-id="${b._id}" data-action="edit">Edit</button>` : ''}
							${canEdit ? `<button class="btn danger" data-id="${b._id}" data-action="delete">Delete</button>` : ''}
						</div>
					</div>
				`;
				list.appendChild(card);
			}
		}

		document.getElementById('list').addEventListener('click', async (e) => {
			const action = e.target.getAttribute('data-action');
			if(!action) return;
			const id = e.target.getAttribute('data-id');
			if(action === 'delete'){
				if(!confirm('Delete this blog?')) return;
				await fetch(`/api/blogs/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
				fetchBlogs();
			} else if(action === 'edit'){
				const newTitle = prompt('New title:');
				if(!newTitle) return;
				await fetch(`/api/blogs/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` }, body: JSON.stringify({ title: newTitle }) });
				fetchBlogs();
			}
		});

		fetchBlogs();
	</script>
</body>
</html>
